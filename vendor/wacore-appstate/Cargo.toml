[package]
name = "wacore-appstate"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
repository = "https://github.com/jlucaso1/whatsapp-rust"
description = "Appstate for WhatsApp protocol (copia do fork intellq, ver VENDORED.md)"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = { version = "1.0", default-features = false }
buffa = { version = "0.9.2", default-features = false, features = ["json"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
log = "0.4"
serde = { version = "1.0", features = ["derive", "rc"] }
serde-big-array = "0.5"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.19"
wacore-binary = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f7468ae2920a2b0aedbd0848cf121de56a07f93c", default-features = false }
wacore-libsignal = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f7468ae2920a2b0aedbd0848cf121de56a07f93c" }
waproto = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f7468ae2920a2b0aedbd0848cf121de56a07f93c" }

[dev-dependencies]
